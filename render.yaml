services:
  - type: web
    name: expense-tracker-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/expenses.db
      - key: PORT
        value: 10000
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
    disk:
      name: expense-db
      mountPath: /data
      sizeGB: 1
